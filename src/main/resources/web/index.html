<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ConviTEC</title>
  <link rel="icon" href="img/icono.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/estilos.css">
  <!-- Leaflet 1.9.4 (mapas), copiado en el proyecto para no depender de un CDN -->
  <script defer src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="saltar" href="#contenido">Saltar al contenido</a>

  <header class="encabezado">
    <button class="boton-menu" id="boton-menu" type="button" aria-expanded="false" aria-controls="menu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      <span>Menú</span>
    </button>

    <a class="marca" href="#inicio" aria-label="ConviTEC, ir al inicio">
      <img src="img/icono.svg" alt="" width="32" height="32">
      <span>ConviTEC</span>
    </a>

    <div class="sede-actual" aria-live="polite">
      <span class="sede-insignia" id="sede-codigo">···</span>
      <span class="sede-texto">
        <span class="sede-etiqueta">Sede</span>
        <strong id="sede-nombre">Cargando…</strong>
      </span>
    </div>

    <div class="proxima-salida" id="proxima-salida" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span>Próxima salida <strong id="proxima-hora"></strong></span>
    </div>

    <div class="usuario-actual" id="usuario-actual" hidden>
      <span class="usuario-texto">
        <span class="sede-etiqueta">Sesión de</span>
        <strong id="usuario-nombre"></strong>
      </span>
      <button class="boton-salir" id="boton-salir" type="button" aria-label="Cerrar sesión" title="Cerrar sesión">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H5v16h4"/><path d="M16 8l4 4-4 4M20 12H10"/></svg>
        <span>Cerrar sesión</span>
      </button>
    </div>
  </header>

  <!-- Inicio de sesión y elección de sede (js/acceso.js); ocupa toda la página -->
  <div id="pantalla-acceso" hidden></div>

  <div class="estructura">
    <nav class="menu" id="menu" aria-label="Secciones"></nav>
    <main class="contenido" id="contenido" tabindex="-1">
      <p class="cargando">Cargando…</p>
    </main>
  </div>

  <div class="aviso aviso-error" id="aviso-conexion" role="alert" hidden></div>

  <noscript>
    <p class="aviso aviso-error">Para usar ConviTEC, active JavaScript en el navegador.</p>
  </noscript>
</body>
</html>
