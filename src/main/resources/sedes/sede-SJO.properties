# Configuracion de la sede SJO (San José) - ConviTEC
#
# Para ejecutar las sedes en 2 computadoras:
# - rabbit.host debe ser la IP de la computadora que tiene el broker RabbitMQ (ej. 192.168.1.20),
#   no "localhost" (en la computadora del broker si puede quedar localhost).
# - El usuario "guest" SOLO funciona desde localhost. Desde otra computadora hay que usar un usuario
#   creado con rabbitmqctl add_user (ver notas.md).
# - Para no subir la clave real al repositorio, definan la variable de entorno CONVITEC_RABBIT_CLAVE:
#   si existe, reemplaza a rabbit.clave.

sede.codigo=SJO
sede.nombre=San José
http.puerto=8083

rabbit.host=localhost
rabbit.puerto=5672
rabbit.usuario=guest
rabbit.clave=guest

# Milisegundos que se espera la respuesta de otra sede a una solicitud de reserva
reserva.timeoutMs=5000

# Carpeta donde esta sede guarda sus archivos (cada sede tiene la suya)
datos.carpeta=datos/SJO
